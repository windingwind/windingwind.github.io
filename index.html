<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Xiàngyù Wáng — PhD student at VISUS, University of Stuttgart. Research on 3D reconstruction, real-time rendering, and neural graphics."
    />
    <meta name="author" content="Xiangyu Wang" />
    <title>Xiàngyù Wáng</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐦‍⬛</text></svg>"
    />
    <script>
      // Restore a flipped theme before first paint to avoid a flash;
      // CSS honors [data-theme-flipped] the same as the checked switch.
      if (localStorage.getItem("theme-flipped") === "1") {
        document.documentElement.setAttribute("data-theme-flipped", "");
      }
    </script>
    <script type="module" src="/src/main.js"></script>
    <script
      defer
      data-domain="windingwind.github.io"
      src="https://plausible.io/js/script.js"
    ></script>
  </head>

  <body>
    <div class="blog-masthead">
      <div class="container">
        <nav class="blog-nav">
          <div class="nav-left">
            <a class="blog-nav-item active" data-section="home" href="/">Home</a>
            <a class="blog-nav-item" data-section="publications" href="/#publications"
              >Publications</a
            >
            <a class="blog-nav-item" data-section="blog" href="/#blog">Blog</a>
            <a
              class="blog-nav-item blog-nav-item-external"
              href="https://github.com/windingwind"
              aria-label="GitHub"
            >
              <svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true">
                <path
                  d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
                />
              </svg>
              <span class="nav-label">GitHub</span></a
            >
            <a
              class="blog-nav-item blog-nav-item-external"
              href="https://scholar.google.com/citations?user=74_PEUIAAAAJ"
              aria-label="Google Scholar"
            >
              <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M5.242 13.769 0 9.5 12 0l12 9.5-5.242 4.269C17.548 11.249 14.978 9.5 12 9.5c-2.977 0-5.548 1.749-6.758 4.269zM12 10a7 7 0 1 0 0 14 7 7 0 0 0 0-14z"
                />
              </svg>
              <span class="nav-label">Google Scholar</span></a
            >
          </div>
          <div class="nav-right">
            <!-- CSS-only theme switcher: :root:has(#theme-switch:checked) flips color-scheme -->
            <input
              type="checkbox"
              id="theme-switch"
              class="theme-switch"
              aria-label="Toggle theme"
            />
            <label for="theme-switch" class="blog-nav-item theme-toggle" title="Toggle theme">
              <span class="theme-icon theme-icon-moon">🌙</span>
              <span class="theme-icon theme-icon-sun">☀️</span>
            </label>
          </div>
        </nav>
      </div>
    </div>

    <div class="container">
      <div class="blog-header">
        <h1 class="blog-title">Xiàngyù Wáng</h1>
        <p class="lead blog-description">Keep enthusiasm and curious</p>
      </div>

      <div class="row">
        <main class="blog-main">
          <div class="blog-post">
            <h2 class="blog-post-title">About Me</h2>
            <p class="blog-post-meta">{{ABOUT_DATE}}</p>
            <hr />
            <div class="markdown-body" id="about-content"><!--ABOUT_CONTENT--></div>
          </div>
          <!-- /.blog-post -->

          <div class="blog-post" id="publications">
            <h2 class="blog-post-title">Publications</h2>
            <p class="blog-post-meta">{{PUBS_DATE}}</p>
            <div id="pub-list"><!--PUB_LIST--></div>
          </div>
          <!-- /.blog-post -->

          <!--BLOG_SECTION-->
        </main>
        <!-- /.blog-main -->

        <aside class="blog-sidebar">
          <div class="sidebar-module sidebar-photo">
            <h4>🐦‍⬛</h4>
            <img src="/static/me.png" alt="me" width="150" />
          </div>
          <div class="sidebar-module sidebar-module-inset">
            <h4>Elsewhere</h4>
            <ol class="list-unstyled">
              <li><a href="https://github.com/windingwind">GitHub</a></li>
              <li>
                <a href="https://scholar.google.com/citations?user=74_PEUIAAAAJ">Google Scholar</a>
              </li>
            </ol>
          </div>
        </aside>
        <!-- /.blog-sidebar -->
      </div>
      <!-- /.row -->
    </div>
    <!-- /.container -->

    <footer class="blog-footer">
      <p>
        Blog template built for
        <a href="https://getbootstrap.com/">Bootstrap</a> by
        <a href="https://twitter.com/mdo">@mdo</a>.
      </p>
    </footer>
  </body>
</html>
